<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400" />
  <title>PRM Extension</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top navigation bar -->
  <nav id="navbar">
    <button class="nav-btn active" data-page="home" title="Home">
      <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
    </button>
    <button class="nav-btn" data-page="settings" title="Settings">
      <span class="nav-icon">⚙️</span><span class="nav-label">Settings</span>
    </button>
    <button class="nav-btn" data-page="url-info" title="URL Info">
      <span class="nav-icon">🔗</span><span class="nav-label">URL Info</span>
    </button>
    <button class="nav-btn" data-page="scraping" title="Scraping">
      <span class="nav-icon">🕷️</span><span class="nav-label">Scraping</span>
    </button>
  </nav>

  <!-- Page container — each child is a page -->
  <main id="page-container">

    <!-- ============ HOME PAGE ============ -->
    <section id="page-home" class="page active">
      <div class="page-inner" id="home-content">
        <!-- Populated by home.js -->
        <p class="loading-text">Loading…</p>
      </div>
    </section>

    <!-- ============ SETTINGS PAGE ============ -->
    <section id="page-settings" class="page">
      <h2>Settings</h2>
      <form id="settings-form" autocomplete="off">
        <label for="api-url">API URL</label>
        <input id="api-url" type="url" placeholder="https://your-prm-api.example.com" required />

        <label for="api-key">API Key</label>
        <input id="api-key" type="text" placeholder="Enter your API key" required />

        <button type="submit" id="save-settings-btn">Save &amp; Verify</button>
      </form>
      <div id="settings-status" class="status-message" role="status"></div>
    </section>

    <!-- ============ URL INFO PAGE ============ -->
    <section id="page-url-info" class="page">
      <h2>URL Info</h2>
      <div id="url-info-content">
        <p class="loading-text">Checking current tab…</p>
      </div>
    </section>

    <!-- ============ SCRAPING PAGE (TBD) ============ -->
    <section id="page-scraping" class="page">
      <h2>Scraping</h2>
      <div class="placeholder-notice">
        <p>🚧 This feature is under development.</p>
        <p>Scraping capabilities will be added in a future update.</p>
      </div>
    </section>

  </main>

  <!-- Scripts (ES modules) -->
  <script type="module" src="js/popup.js"></script>
</body>
</html>
