<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=360" />
  <title>PRM Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ============ VIEW 1: Server URL Input ============ -->
  <section id="view-server-url" class="view">
    <div class="view-inner">
      <div class="view-header">
        <img src="../icons/icon-48.png" alt="PRM logo" class="view-logo" />
        <h1 class="view-title">PRM Extension</h1>
        <p class="view-subtitle">Connect to your PRM instance</p>
      </div>

      <form id="server-url-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="server-url-input">Server URL</label>
          <input
            id="server-url-input"
            class="form-input"
            type="url"
            placeholder="https://prm.example.com"
            required
          />
          <span class="form-helper">The URL of your self-hosted PRM instance</span>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="connect-btn">
          Connect
        </button>
      </form>

      <div id="server-url-status" class="status-message" role="status"></div>
    </div>
  </section>

  <!-- ============ VIEW 2: Code Entry ============ -->
  <section id="view-code-entry" class="view" style="display:none;">
    <div class="view-inner">
      <div class="view-header">
        <h1 class="view-title">Enter Pairing Code</h1>
        <p class="view-subtitle">Open PRM Settings → Chrome Extension to see your code</p>
      </div>

      <form id="code-entry-form" autocomplete="off">
        <div class="code-input-group">
          <input class="code-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-index="0" aria-label="Digit 1" />
          <input class="code-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-index="1" aria-label="Digit 2" />
          <input class="code-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-index="2" aria-label="Digit 3" />
          <input class="code-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-index="3" aria-label="Digit 4" />
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="verify-btn" disabled>
          Verify
        </button>
      </form>

      <div id="code-entry-status" class="status-message" role="status"></div>

      <button class="btn-link" id="change-server-btn">
        ← Change server URL
      </button>
    </div>
  </section>

  <!-- ============ VIEW 3: Connected / Search ============ -->
  <section id="view-connected" class="view" style="display:none;">
    <div class="view-inner">
      <div class="connected-header">
        <div class="connected-status">
          <span class="status-dot status-dot-green"></span>
          <h1 class="view-title">Connected to PRM</h1>
        </div>
      </div>

      <div class="search-group">
        <div class="search-input-wrapper">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
          <input
            id="search-input"
            class="form-input search-input"
            type="text"
            placeholder="Search contacts..."
            autocomplete="off"
          />
        </div>
      </div>

      <div id="search-results" class="search-results"></div>

      <div class="view-footer">
        <button class="btn btn-danger btn-full" id="disconnect-btn">
          Disconnect
        </button>
      </div>
    </div>
  </section>

  <!-- Scripts (ES modules) -->
  <script type="module" src="js/popup.js"></script>
</body>
</html>
